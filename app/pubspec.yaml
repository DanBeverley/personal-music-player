name: auralis_engine
description: "High-performance audio player leveraging C++ Audio DSP and Riverpod state."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  ffi: ^2.1.0
  path_provider: ^2.1.1
  http: ^1.6.0
  audio_service: ^0.18.18
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  just_audio: ^0.10.5
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  supabase_flutter: ^2.12.0
  permission_handler: ^12.0.1
  record: ^6.0.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/neatie_3rd.png
    - assets/branding/neatie_login_wave_bg.png

flutter_launcher_icons:
  android: true
  image_path: assets/branding/neatie_3rd.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/neatie_3rd.png
  adaptive_icon_foreground_inset: 25
