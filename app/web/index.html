<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1010">
  <meta name="description" content="Neatie music player">
  <title>Neatie</title>
  <style>
    html, body { margin: 0; background: #0d1010; }
    #welcome { position: fixed; inset: 0; display: grid; place-content: center;
      color: #f3f0e8; text-align: center; font-family: Georgia, serif; }
    #welcome strong { font-size: 44px; font-weight: 400; letter-spacing: -1px; }
    #welcome span { margin-top: 18px; font: 12px system-ui, sans-serif; color: #a6b2aa; letter-spacing: 2px; }
    @media (prefers-reduced-motion: no-preference) { #welcome { animation: appear .7s ease-out; } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="welcome" role="status"><strong>neatie</strong><span>SETTLE IN. PRESS PLAY.</span></div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('welcome')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
