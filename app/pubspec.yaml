name: auralis_engine
description: "High-performance audio player leveraging C++ Audio DSP and Riverpod state."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  ffi: ^2.1.0
  path_provider: ^2.1.1
  http: ^1.6.0
  audio_service: ^0.18.18
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  just_audio: ^0.10.5
  image_picker: ^1.1.2
  supabase_flutter: ^2.12.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ebb_app_icon.png
    - assets/branding/ebb_intro_mark.png
    - assets/branding/ebb_intro_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/ebb_app_icon.png
