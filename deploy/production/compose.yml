name: neatie

x-backend-common: &backend-common
  build:
    context: ../../ingestion/python_proxy
    dockerfile: Dockerfile
  env_file:
    - /opt/neatie/shared/backend.env
  environment:
    AURALIS_RUNTIME_DIR: /var/lib/neatie/runtime
    AURALIS_PROXY_RUNTIME_DIR: /var/lib/neatie/runtime
    PORT: "8000"
  volumes:
    - /var/lib/neatie/runtime:/var/lib/neatie/runtime
    - /var/lib/neatie/downloads:/app/downloads
    - /var/lib/neatie/secrets:/run/neatie-secrets:ro
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  networks:
    - backend

services:
  api:
    <<: *backend-common
    environment:
      AURALIS_RUNTIME_DIR: /var/lib/neatie/runtime
      AURALIS_PROXY_RUNTIME_DIR: /var/lib/neatie/runtime
      PORT: "8000"
      RECOMMENDATION_ENABLE_SCHEDULER: "0"
      RECOMMENDATION_EXTERNAL_WORKER: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5));
          assert 'running' in str(payload.get('status', '')).lower()
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 45s

  recommendation-worker:
    <<: *backend-common
    command: ["python", "worker_main.py"]
    environment:
      AURALIS_RUNTIME_DIR: /var/lib/neatie/runtime
      AURALIS_PROXY_RUNTIME_DIR: /var/lib/neatie/runtime
      RECOMMENDATION_ENABLE_SCHEDULER: "1"
      RECOMMENDATION_EXTERNAL_WORKER: "1"

  caddy:
    image: caddy:2-alpine
    environment:
      AURALIS_API_HOST: ${AURALIS_API_HOST:?AURALIS_API_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
