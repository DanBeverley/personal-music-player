name: auralis_engine
description: "High-performance audio player leveraging C++ Audio DSP and Riverpod state."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  ffi: ^2.1.0
  path_provider: ^2.1.1
  http: ^1.6.0
  audio_service: ^0.18.18
  audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
