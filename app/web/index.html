<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1010">
  <meta name="description" content="Neatie music player">
  <link rel="icon" type="image/svg+xml" href="icons/neatie.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/neatie-180.png">
  <meta name="apple-mobile-web-app-title" content="Neatie">
  <link rel="manifest" href="manifest.json">
  <title>Neatie</title>
  <style>
    html, body { margin: 0; background: #0d1010; }
    #welcome { position: fixed; inset: 0; z-index: 10000; background: #0d1010;
      display: grid; place-content: center; opacity: 1;
      color: #f3f0e8; text-align: center; font-family: Georgia, serif; }
    #welcome.leaving { opacity: 0; pointer-events: none; }
    #welcome strong { font-size: 44px; font-weight: 400; letter-spacing: -1px; }
    #welcome .brand { display: flex; align-items: center; justify-content: center; gap: 14px; }
    #welcome img { width: 42px; height: 42px; }
    #welcome span { margin-top: 18px; font: 12px system-ui, sans-serif; color: #a6b2aa; letter-spacing: 2px; }
    #welcome .pulse { display: flex; justify-content: center; align-items: center; gap: 5px; height: 32px; margin-top: 24px; }
    #welcome i { width: 3px; height: 12px; border-radius: 3px; background: #ceddbb; }
    @media (prefers-reduced-motion: no-preference) {
      #welcome { animation: appear .7s ease-out; }
      #welcome.leaving { animation: none; transition: opacity .18s ease-out; }
      #welcome i { animation: listen 1.4s ease-in-out infinite alternate; }
      #welcome i:nth-child(2) { animation-delay: -.7s; }
      #welcome i:nth-child(3) { animation-delay: -.3s; }
      #welcome i:nth-child(4) { animation-delay: -1s; }
      #welcome i:nth-child(5) { animation-delay: -.5s; }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes listen { from { transform: scaleY(.5); opacity: .5; } to { transform: scaleY(1.8); opacity: 1; } }
  </style>
</head>
<body>
  <div id="welcome" role="status" aria-label="Opening Neatie">
    <div class="brand"><img src="icons/neatie.svg" alt=""><strong>neatie</strong></div>
    <span>SETTLE IN. PRESS PLAY.</span>
    <div class="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <script>
    (() => {
      window.addEventListener('flutter-first-frame', () => {
        performance.mark('neatie:flutter-first-frame');
        const welcome = document.getElementById('welcome');
        if (!welcome) return;
        welcome.dataset.release = 'first-frame';
        welcome.classList.add('leaving');
        setTimeout(() => welcome.remove(),
          matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 200);
      }, {once: true});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
