# Apply alongside compose.yml. The API is shared with the Android app.
services:
  caddy:
    environment:
      AURALIS_WEB_HOST: ${AURALIS_WEB_HOST:?AURALIS_WEB_HOST is required}
    volumes:
      - ./Caddyfile.preview:/etc/caddy/Caddyfile:ro
      - ./Caddyfile:/etc/caddy/api.caddy:ro
    depends_on:
      web-preview:
        condition: service_started
  web-preview:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro
      - ../../app/build/web:/srv:ro
      - web_access_logs:/var/log/neatie
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

volumes:
  web_access_logs:
