name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [codex/web-app, develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ingestion/python_proxy
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AURALIS_RUNTIME_DIR: ${{ runner.temp }}/neatie-ci
      AURALIS_PROXY_RUNTIME_DIR: ${{ runner.temp }}/neatie-ci
      RECOMMENDATION_ENABLE_SCHEDULER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/python_proxy/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 httpx==0.28.1 pytest-socket==0.7.0 ruff==0.14.14
      - name: Lint backend syntax and API entry points
        run: |
          python -m ruff check --select E9,F63,F7 server.py api_app.py auralis_backend
          python -m ruff check --select F82 api_app.py auralis_backend/api/routes.py auralis_backend/contracts.py
      - name: Test API, catalogue, Search, playback and Home contracts
        run: >-
          python -m pytest -q --strict-markers --disable-socket --allow-unix-socket
          test_api_contracts.py test_catalog_normalization.py test_details_reliability.py
          test_search_latency.py test_home_feed_contracts_v2.py
          test_cached_aac.py test_direct_cached_delivery.py test_initial_cached_redirect.py

  flutter:
    name: Flutter checks and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:arch:-:channel:-:version:-:hash:-${{ hashFiles('app/pubspec.lock') }}"
      - name: Install locked packages
        run: flutter pub get --enforce-lockfile
      - name: Check regression test formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          test/app_update_provider_test.dart test/audio_queue_runtime_test.dart
          test/catalog_detail_test.dart test/catalog_api_test.dart
          test/web_player_test.dart test/web_library_test.dart test/chart_region_test.dart
      - name: Analyze selected client code
        run: >-
          flutter analyze --no-pub --fatal-infos
          lib/logic/audio_queue_runtime.dart lib/web/chart_region.dart
          lib/web/search_history.dart test/app_update_provider_test.dart test/catalog_detail_test.dart
      - name: Test Android and web client contracts
        run: >-
          flutter test --no-pub
          test/app_update_provider_test.dart test/audio_queue_runtime_test.dart
          test/catalog_detail_test.dart test/catalog_api_test.dart
          test/web_player_test.dart test/web_library_test.dart test/chart_region_test.dart
      - name: Build web release
        run: |
          flutter build web --release --no-pub --no-web-resources-cdn --target lib/web/web_app.dart
          test -s build/web/main.dart.js
          test -s build/web/index.html
